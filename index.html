<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raju Grocery Admin App</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#2e7d32;color:#fff;text-align:center;padding:15px}
section{background:#fff;margin:10px;padding:10px;border-radius:10px}
input,textarea{width:100%;padding:8px;margin:5px 0}
button{padding:10px;border:none;border-radius:6px;margin-top:5px}
.green{background:#2e7d32;color:#fff}
.orange{background:orange;color:#fff}
.admin{background:#000;color:#fff}
.card{border:1px solid #ddd;padding:10px;margin:5px;border-radius:8px}
</style>
</head>

<body>

<header>
<h2>RAJU ENTERPRISES</h2>
<p>Online Grocery App</p>
</header>

<section>
<h3>Customer Details</h3>
<input id="name" placeholder="Name">
<input id="mobile" placeholder="Mobile">
<textarea id="address" placeholder="Address"></textarea>
</section>

<section>
<h3>Order Items</h3>
<input id="item" placeholder="Item Name">
<input id="price" placeholder="Price">
<input id="qty" placeholder="Quantity">
<button class="green" onclick="addItem()">Add Item</button>
<div id="cart"></div>
<h3>Total ₹<span id="total">0</span></h3>
<button class="orange" onclick="payUPI()">Pay via UPI</button>
<button class="green" onclick="placeOrder()">Place Order</button>
</section>

<section>
<h3>Admin Panel</h3>
<button class="admin" onclick="adminLogin()">Open Admin Dashboard</button>
<div id="admin"></div>
</section>

<script>
// 🔥 Firebase config (CHANGE THIS)
var firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
 projectId: "YOUR_PROJECT",
 storageBucket: "YOUR_PROJECT.appspot.com",
 messagingSenderId: "XXXX",
 appId: "XXXX"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

let cart=[];
function addItem(){
 let i=item.value,p=price.value,q=qty.value;
 if(!i||!p||!q)return alert("Fill all");
 cart.push({i,p,q});
 render();
}
function render(){
 let t=0,html="";
 cart.forEach(x=>{
  t+=x.p*x.q;
  html+=`<div class="card">${x.i} | ₹${x.p} x ${x.q}</div>`;
 });
 cart.innerHTML=html;
 total.innerText=t;
}
function payUPI(){
 let t=total.innerText;
 location.href=`upi://pay?pa=96316991969631@ibl&pn=Raju%20Store&am=${t}&cu=INR`;
}
function placeOrder(){
 let order={
  name:name.value,
  mobile:mobile.value,
  address:address.value,
  items:cart,
  total:total.innerText,
  time:new Date().toLocaleString()
 };
 db.ref("orders").push(order);
 alert("Order Saved in Firebase");
 cart=[]; render();
}
function adminLogin(){
 let p=prompt("Admin Password");
 if(p!=="1234")return alert("Wrong password");
 db.ref("orders").on("value",s=>{
  let d=s.val(),html="<h4>All Orders</h4>";
  for(let k in d){
   html+=`<div class="card">
   ${d[k].name} | ₹${d[k].total}<br>
   ${d[k].mobile}<br>${d[k].address}
   </div>`;
  }
  admin.innerHTML=html;
 });
}
</script>

</body>
  </html>
