<head>

  <title>Raju Enterprises Grocery</title>  <!-- PWA -->  <link rel="manifest" href="manifest.json" />

    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4}
    header{background:#2e7d32;color:#fff;padding:15px;text-align:center}
    .section{background:#fff;margin:12px;padding:12px;border-radius:10px}
    .section input,.section textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
    .container{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

    .card button{background:#2e7d32;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}
    .footer{position:fixed;bottom:0;width:100%;background:#fff;padding:10px;box-shadow:0 -2px 6px rgba(0,0,0,.1)}
    .pay{background:#ff9800;color:#fff;width:100%;padding:10px;border:none;border-radius:6px;margin-bottom:6px}
    .wa{background:#25d366;color:#fff;width:100%;padding:10px;border:none;border-radius:6px}
    .admin{display:none}
  </style></head>
<body><header>
  <h2>RAJU ENTERPRISES</h2>
  <div>Grocery Store · Pincode 122051</div>
</header><div class="section">
  <h3>Customer Details</h3>
  <input id="cname" placeholder="Customer Name" />
  <input id="cmobile" placeholder="Mobile Number" />
  <textarea id="caddress" placeholder="Address"></textarea>
</div><div class="section">
  <div class="container">
    <div class="card">
      <img src="images/aata.png" onerror="this.src='aata.png'" />
      <h4>Aata 5kg</h4>
      <div>₹250</div>
      <button onclick="addItem('Aata 5kg',250)">Add</button>
    </div>
    <div class="card">
      <img src="images/rice.png" onerror="this.src='atta.jpg'" />

      <div>₹300</div>
      <button onclick="addItem('Rice 5kg',300)">Add</button>
    </div>
    <div class="card">
      <img src="images/oil.png" onerror="this.src='oil.jpg'" />
      <h4>Oil 1L</h4>
      <div>₹180</div>
      <button onclick="addItem('Oil 1L',180)">Add</button>
    </div>
  </div>
</div><div style="height:160px"></div><div class="footer">
  <strong>Total: ₹<span id="total">0</span></strong>
  <button class="pay" onclick="payUPI()">Pay via UPI</button>
  <button class="wa" onclick="orderWhatsApp()">Order on WhatsApp</button>
</div><script>
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function addItem(name, price){
    cart.push({name, price});
    localStorage.setItem('cart', JSON.stringify(cart));
    updateTotal();
  }

  function updateTotal(){
    let t = cart.reduce((s,i)=>s+i.price,0);
    document.getElementById('total').innerText = t;
  }

  function payUPI(){
    let amount = document.getElementById('total').innerText;
    if(amount==0){alert('Add item first');return;}
    let upi = `upi://pay?pa=YOURUPIID@upi&pn=Raju%20Enterprises&am=${amount}&cu=INR`;
    window.location.href = upi;
  }
