<!DOCTYPE html>
<html>
<head>
  <title>RAJU ENTERPRISES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;margin:0;background:#f5f5f5}
    header{background:#2e7d32;color:white;text-align:center;padding:15px}
    .products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
    .card{background:white;padding:10px;border-radius:10px;text-align:center}
    .card img{width:100px;height:100px}
    button{background:#2e7d32;color:white;border:none;padding:8px 15px;border-radius:5px}
  </style>
</head>

<body>

<header>
  <img src="raju.jpg" style="width:120px;border-radius:50%">
  <h2>RAJU ENTERPRISES</h2>
  <p>Grocery Store · Pincode 122051</p>
</header>

<div class="products">
  <div class="card">
    <img src="atta.jpg">
    <h4>Aata 5kg</h4>
    <p>₹250</p>
    <button>Add</button>
  </div>

  <div class="card">
    <img src="rice.jpg">
    <h4>Rice 5kg</h4>
    <p>₹300</p>
    <button>Add</button>
  </div>

  <div class="card">
    <img src="oil.jpg">
    <h4>Oil 1L</h4>
    <p>₹180</p>
    <button>Add</button>
  </div>
</div>

</body>
</html>
