
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJU ENTERPRISES – Grocery Store</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#2e7d32;color:#fff;padding:15px;text-align:center}
.container{padding:10px}
.section{background:#fff;padding:10px;margin-bottom:10px;border-radius:8px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border-radius:8px;padding:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.card img{width:100%;height:120px;object-fit:contain}
.qty{display:flex;justify-content:center;gap:10px;margin:5px 0}
button{background:#2e7d32;color:#fff;border:none;padding:6px 10px;border-radius:5px;cursor:pointer}
.pay{width:100%;padding:12px;font-size:16px;margin-top:8px}
.wa{background:#25D366}
.upi{background:#ff9800}
footer{position:sticky;bottom:0;background:#fff;padding:10px;border-top:1px solid #ccc}
input,textarea{width:100%;padding:8px;margin-bottom:5px}
</style>
</head>

<body>

<header>
<h2>RAJU ENTERPRISES</h2>
<div>Grocery Store</div>
</header>

<div class="container">

<div class="section">
<h3>Customer Details</h3>
<input id="cname" placeholder="Customer Name">
<input id="cmobile" placeholder="Mobile Number">
<textarea id="caddress" placeholder="Address"></textarea>
</div>

<div class="section">
<h3>Grocery Items</h3>
<div class="products" id="products"></div>
</div>

</div>

<footer>
<b>Total: ₹<span id="total">0</span></b>
<button class="pay upi" onclick="payUPI()">Pay via UPI</button>
<button class="pay wa" onclick="orderWhatsApp()">Order on WhatsApp</button>
</footer>

<script>
const items = [
 {name:"Aata 5kg",price:250,img:"atta.jpg"},
 {name:"Rice 5kg",price:300,img:"rice.jpg"},
 {name:"Oil 1L",price:180,img:"oil.jpg"},
 {name:"Sugar 1kg",price:45,img:"sugar.jpg"},
 {name:"Salt 1kg",price:20,img:"salt.jpg"},
 {name:"Tea",price:120,img:"tea.jpg"},
 {name:"Milk",price:60,img:"milk.jpg"},
 {name:"Biscuit",price:30,img:"biscuit.jpg"},
 {name:"Soap",price:35,img:"soap.jpg"},
 {name:"Shampoo",price:90,img:"shampoo.jpg"},
 {name:"Dal",price:140,img:"dal.jpg"},
 {name:"Besan",price:80,img:"besan.jpg"},
 {name:"Poha",price:60,img:"poha.jpg"},
 {name:"Suji",price:55,img:"suji.jpg"},
 {name:"Chawal",price:70,img:"chawal.jpg"},
 {name:"Namkeen",price:50,img:"namkeen.jpg"},
 {name:"Toothpaste",price:95,img:"toothpaste.jpg"},
 {name:"Detergent",price:110,img:"detergent.jpg"}
];

let cart={};
const pDiv=document.getElementById("products");

items.forEach((i,idx)=>{
 cart[idx]=0;
 pDiv.innerHTML+=`
 <div class="card">
 <img src="images/${i.img}" onerror="this.src='${i.img}'">
 <b>${i.name}</b>
 <div>₹${i.price}</div>
 <div class="qty">
 <button onclick="change(${idx},-1)">−</button>
 <span id="q${idx}">0</span>
 <button onclick="change(${idx},1)">+</button>
 </div>
 </div>`;
});

function change(id,val){
 cart[id]=Math.max(0,cart[id]+val);
 document.getElementById("q"+id).innerText=cart[id];
 updateTotal();
}

function updateTotal(){
 let t=0;
 items.forEach((i,idx)=>t+=i.price*cart[idx]);
 document.getElementById("total").innerText=t;
}

function payUPI(){
 let amt=document.getElementById("total").innerText;
 if(amt==0){alert("Please item add kare");return;}
 let upi="upi://pay?pa=96316991969631@ibl&pn=RAJU%20ENTERPRISES&am="+amt+"&cu=INR";
 window.location.href=upi;
}

function orderWhatsApp(){
 let name=cname.value, mob=cmobile.value, add=caddress.value;
 if(name==""||mob==""){alert("Name & Mobile required");return;}

 let msg="🛒 *RAJU ENTERPRISES ORDER* %0A%0A";
 items.forEach((i,idx)=>{
  if(cart[idx]>0){
   msg+=`${i.name} x ${cart[idx]} = ₹${i.price*cart[idx]}%0A`;
  }
 });
 msg+=`%0A*Total:* ₹${total.innerText}%0A`;
 msg+=`%0A*Name:* ${name}%0A*Mobile:* ${mob}%0A*Address:* ${add}`;

 let url="https://wa.me/919631699196?text="+msg;
 window.open(url,"_blank");
}
</script>

</body>
</html>
